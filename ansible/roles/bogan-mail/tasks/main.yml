---
###############################################################################
# ROLE: bogan-mail
# HOST: Bogan — Debian 12 (packet .203) — Mail Server
#
# STANDS UP:  Postfix (SMTP) + Dovecot (IMAP/POP3), delivering to Maildir for
#             local accounts.
#
# INTENTIONAL, STATIC MISCONFIG ONLY (no attack tooling):
#   - Mailbox accounts mirror the AD users 1:1 (same usernames) with the SAME
#     passwords (reused from Deathstar). Compromise of a mail account yields
#     the matching AD credential and vice versa — the mail<->AD overlap.
#   - Plaintext IMAP/POP3 auth without TLS is allowed (sniffable creds).
#
# Accounts + passwords come from the canonical ccdc_ad_users (mail:true).
# Name resolution is local via /etc/hosts.
###############################################################################

- name: Assert shared vars are present (from global_role_vars)
  ansible.builtin.assert:
    that:
      - ccdc_domain is defined
      - ccdc_ad_users is defined and (ccdc_ad_users | length) > 0
      - ccdc_dns_hosts is defined
    fail_msg: "ccdc_domain / ccdc_ad_users / ccdc_dns_hosts missing — set them in global_role_vars."

- name: Add /etc/hosts entries for the service hosts (same /24 as this host)
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} CCDC RANGE HOSTS"
    block: |
      {% set prefix = ansible_default_ipv4.address.split('.')[0:3] | join('.') %}
      {% for h in ccdc_dns_hosts %}
      {{ prefix }}.{{ h.octet }} {{ h.name }}.{{ ccdc_domain.fqdn }} {{ h.name }}
      {% endfor %}

# --- Preseed Postfix so apt install is non-interactive ----------------------
- name: Preseed Postfix debconf (Internet Site)
  become: true
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.q }}"
    vtype: "{{ item.t }}"
    value: "{{ item.v }}"
  loop:
    - { q: "postfix/main_mailer_type", t: "select", v: "Internet Site" }
    - { q: "postfix/mailname", t: "string", v: "bogan.{{ ccdc_domain.fqdn }}" }
  loop_control:
    label: "{{ item.q }}"

- name: Install Postfix + Dovecot
  become: true
  ansible.builtin.apt:
    name: "{{ bogan_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Mail accounts that mirror AD (same username + password) ----------------
- name: Create mailbox users mirroring AD (reused passwords)
  become: true
  ansible.builtin.user:
    name: "{{ item.sam }}"
    password: "{{ item.password | password_hash('sha512') }}"
    shell: "{{ bogan_mail_shell }}"
    create_home: true
  loop: "{{ ccdc_ad_users | selectattr('mail', 'defined') | selectattr('mail') | list }}"
  loop_control:
    label: "{{ item.sam }}"
  no_log: true

- name: Ensure each mailbox has a Maildir
  become: true
  ansible.builtin.file:
    path: "/home/{{ item.sam }}/Maildir"
    state: directory
    owner: "{{ item.sam }}"
    group: "{{ item.sam }}"
    mode: "0700"
  loop: "{{ ccdc_ad_users | selectattr('mail', 'defined') | selectattr('mail') | list }}"
  loop_control:
    label: "{{ item.sam }}"

# --- Config ----------------------------------------------------------------
- name: Install Postfix main.cf
  become: true
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    mode: "0644"
  notify: restart postfix

- name: Install Dovecot local config
  become: true
  ansible.builtin.template:
    src: dovecot-local.conf.j2
    dest: /etc/dovecot/conf.d/99-ccdc.conf
    mode: "0644"
  notify: restart dovecot

- name: Ensure Postfix and Dovecot are running and enabled
  become: true
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - postfix
    - dovecot
