---
# deathstar-ad — role-specific knobs (non-shared).
# Shared identities/secrets (ccdc_ad_users, ccdc_ad_service_account,
# ccdc_domain, ccdc_db, ccdc_dns_hosts, ccdc_local_admin) are the CANONICAL
# source of truth in global_role_vars (ludus-range-config.yml). This role
# READS them; it does not redefine them, to avoid drift.

# Password policy is relaxed so the intentionally weak lab passwords are
# accepted and remain crackable (the packet's AD-hash recovery scenario).
deathstar_pw_complexity_enabled: false
deathstar_pw_min_length: 4
deathstar_pw_min_age_days: 0
deathstar_pw_max_age_days: 0        # 0 = never expire (lab stability)

# AD groups created under the StarBar OU. User records in ccdc_ad_users
# reference these names.
deathstar_groups:
  - Accounting
  - Bartenders
  - Karaoke
  - Staff

# Create forward DNS A-records for the Linux service hosts.
# LOAD-BEARING: the shared ccdc_db.host (ashla.bars.local) and other hostname
# references resolve ONLY because this role publishes these A-records. If you
# set this false, Tython/Wookie/Bogan must reference hosts by IP instead, or
# name resolution must be provided elsewhere. Leave true unless you know you
# have another resolver.
deathstar_manage_dns: true
