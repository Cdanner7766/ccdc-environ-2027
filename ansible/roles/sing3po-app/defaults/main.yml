---
# sing3po-app — role-specific knobs (non-shared).
# Stand-alone karaoke app (no DB path). Its single chained weakness is the
# svc_karaoke credential (canonical ccdc_ad_service_account) stored on disk,
# tying to the kerberoastable SPN on Deathstar.

sing3po_packages:
  - httpd
  - firewalld

sing3po_docroot: /var/www/html
sing3po_conf_dir: /etc/starbar
