---
# wookie-web-ftp — role-specific knobs (non-shared).
# Shared DB creds (ccdc_db.*) + host list (ccdc_dns_hosts) come from
# global_role_vars.

wookie_packages:
  - apache2
  - php
  - libapache2-mod-php
  - php-mysql
  - vsftpd

wookie_docroot: /var/www/starbar-web

# INTENTIONAL weak FTP account (write access to the web root).
wookie_ftp_user: ftpuser
wookie_ftp_password: "cantina"
wookie_ftp_anonymous: false
