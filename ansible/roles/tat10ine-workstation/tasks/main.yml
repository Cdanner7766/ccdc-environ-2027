---
###############################################################################
# ROLE: tat10ine-workstation
# HOST: Tat10ine — Windows 10 (packet .9) — Accounting + the BOSS's computer
#
# STANDS UP:  The accounting / owner workstation. Domain join is native
#             (Ludus role: member -> Deathstar).
#
# INTENTIONAL, STATIC MISCONFIG ONLY (no attack tooling):
#   - A local administrator account (ccdc_local_admin) with the SAME password
#     reused across workstations -> AD/workstation lateral-movement path.
#   - Sensitive accounting/owner files on disk: synthetic payroll (with fake
#     bank fields) and a customer PII list (packet -25 corporate-data / -200
#     PII targets), plus an owner note that discloses the reused local-admin
#     password (a recoverable sensitive file that bridges to lateral movement).
#   - Cached domain credentials are an inherent property of a domain-joined
#     workstation; nothing extra is scripted for that.
###############################################################################

- name: Assert shared vars are present (from global_role_vars)
  ansible.builtin.assert:
    that:
      - ccdc_local_admin is defined
      - ccdc_local_admin.username is defined
      - ccdc_local_admin.password is defined
    fail_msg: "ccdc_local_admin.* missing — set it in global_role_vars."

- name: Create the reused local administrator account
  ansible.windows.win_user:
    name: "{{ ccdc_local_admin.username }}"
    password: "{{ ccdc_local_admin.password }}"
    password_never_expires: true
    groups:
      - Administrators
    groups_action: add
    state: present
  no_log: true

- name: Create the accounting directory
  ansible.windows.win_file:
    path: "{{ tat10ine_accounting_dir }}"
    state: directory

- name: Drop synthetic accounting / PII files
  ansible.windows.win_copy:
    src: accounting/
    dest: "{{ tat10ine_accounting_dir }}\\"

- name: Drop the owner's note disclosing the reused local-admin password
  ansible.windows.win_copy:
    dest: "{{ tat10ine_accounting_dir }}\\boss_notes.txt"
    content: |
      STAR BARS - owner notes (do not share)
      ---------------------------------------
      Reminder: the local admin account is the same on every front-of-house PC.
        user: {{ ccdc_local_admin.username }}
        pass: {{ ccdc_local_admin.password }}
      Need to rotate this someday. Also need to stop writing it down.
  no_log: true
